<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>امتحان أسس حفظ الأغذية – Fatima Hany</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marhey:wght@400;500;600;700&family=Kalam:wght@400;700&family=Yellowtail&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--ink:#24263A;--soft:#6B6D80;--card:#FFFFFF;--line:#E7E3EE;--navy:#1E2A4F;--gold:#D4AF37;--lgold:#F5DC8E;--pink:#F8C8DA;--pinkInk:#B23E6E;--mauve:#8B68B5;--mauveBg:#F1EAF8;--teal:#2FA79D;--tealBg:#E2F5F3;--ok:#2E9E5B;--okBg:#E7F6EC;--bad:#D14343;--badBg:#FDECEC;--skip:#8E929B;--skipBg:#F1F2F4;--shadow:0 2px 10px rgba(30,42,79,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15172A;--ink:#ECEAF4;--soft:#A9A7BE;--card:#1F2238;--line:#33364F;--navy:#0F1530;--pink:#5A2A40;--pinkInk:#F4A6C4;--mauve:#C2A4E6;--mauveBg:#33294A;--teal:#6CD3C9;--tealBg:#1B3836;--ok:#5DD08B;--okBg:#173525;--bad:#F07A7A;--badBg:#3E1D1D;--skip:#A6AAB3;--skipBg:#2A2C3A;--shadow:none}}
:root[data-theme="dark"]{--bg:#15172A;--ink:#ECEAF4;--soft:#A9A7BE;--card:#1F2238;--line:#33364F;--navy:#0F1530;--pink:#5A2A40;--pinkInk:#F4A6C4;--mauve:#C2A4E6;--mauveBg:#33294A;--teal:#6CD3C9;--tealBg:#1B3836;--ok:#5DD08B;--okBg:#173525;--bad:#F07A7A;--badBg:#3E1D1D;--skip:#A6AAB3;--skipBg:#2A2C3A;--shadow:none}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Marhey',system-ui,sans-serif;font-size:16px;line-height:1.75}
.en,[dir=ltr]{font-family:'Kalam','Marhey',cursive}
header{background:var(--navy);color:#fff;padding:20px 16px 18px;text-align:center;border-bottom:5px solid var(--gold)}
.course{font-size:clamp(20px,4.6vw,28px);font-weight:700;line-height:1.35}
.sub{color:#D9DDF0;font-size:14px;margin-top:2px}
.name{font-family:'Yellowtail',cursive;font-size:42px;color:var(--lgold);direction:ltr;line-height:1.2;margin-top:6px;text-shadow:0 2px 3px rgba(0,0,0,.35)}
.topbar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;box-shadow:var(--shadow)}
.topin{max-width:820px;margin:0 auto}
.ptxt{font-size:14px;font-weight:600;display:flex;justify-content:space-between}
.track{height:9px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:5px}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--mauve),var(--pinkInk),var(--gold));transition:width .25s}
main{max-width:820px;margin:0 auto;padding:18px 14px 30px}
