<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>امتحان السكشن الأول - تكنولوجيا منتجات الألبان</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#10263F;--gold:#D4AF37;--sky:#EAF1F7;--ink:#17324D;--soft:#5B7590;--card:#FFFFFF;--blue:#2F6F9F;--ok:#2E7D57;--okbg:#E4F3EB;--bad:#B2413A;--badbg:#FBE8E6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--sky);color:var(--ink);font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;line-height:1.7}
  .bar{background:var(--navy);padding:22px 16px;text-align:center}
  .bar .name{font-family:'Aref Ruqaa',serif;font-weight:700;color:var(--gold);font-size:2.6rem;line-height:1.5;margin:0}
  .bar .sub{color:#C3D4E4;font-size:1rem;margin:6px 0 0}
  .wrap{max-width:720px;margin:0 auto;padding:22px 16px 40px}
  h1{font-size:1.5rem;margin:0 0 6px}
  .muted{color:var(--soft)}
  .q{background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:16px}
  .qh{font-weight:700;font-size:1.1rem;margin-bottom:12px}
  .qh .n{color:var(--blue);font-weight:800;margin-left:6px}
  label{display:block;background:var(--sky);border:2px solid transparent;border-radius:10px;padding:11px 14px;margin-bottom:8px;cursor:pointer}
  label:hover{border-color:var(--blue)}
  input[type=radio]{margin-left:8px;accent-color:var(--navy)}
  .q.right label.sel{background:var(--okbg);border-color:var(--ok)}
  .q.wrong label.sel{background:var(--badbg);border-color:var(--bad)}
  label.key{background:var(--okbg);border-color:var(--ok)}
  .fb{display:none;border-radius:10px;padding:12px 14px;margin-top:10px}
  .fb.show{display:block}
  .fb.ok{background:var(--okbg);border-right:5px solid var(--ok)}
  .fb.no{background:var(--badbg);border-right:5px solid var(--bad)}
  .fb b{display:block;margin-bottom:3px}
  .btn{font:inherit;font-weight:700;font-size:1.1rem;border:none;border-radius:12px;padding:15px;background:var(--navy);color:#fff;width:100%;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--navy);border:2px solid var(--navy);margin-top:10px}
  #result{display:none;background:var(--navy);color:#fff;border-radius:14px;padding:20px;text-align:center;margin-bottom:18px}
  #result.show{display:block}
  #result .sc{font-size:3.4rem;font-weight:800;color:var(--gold);line-height:1.1}
  .end{margin-top:26px;background:var(--navy);border-radius:14px;padding:24px 18px;text-align:center}
  .end p{color:#D8E5F0;margin:0 0 10px}
  .end .name{font-family:'Aref Ruqaa',serif;color:var(--gold);font-size:2.1rem;margin:0}
  @media(max-width:480px){.bar .name{font-size:2rem}.end .name{font-size:1.7rem}}
</style>
</head>
<body>

<div class="bar">
  <p class="name">فاطمة هاني</p>
  <p class="sub">امتحان الدرس العملي الأول · تكنولوجيا منتجات الألبان</p>
</div>

<div class="wrap">
  <h1>اختبارات استلام اللبن ومدى صلاحيته التكنولوجية</h1>
  <p class="muted">٢٥ سؤال اختيار من متعدد · اختر إجابة واحدة لكل سؤال ثم اضغط «صحح الامتحان» في الآخر.</p>

  <div id="result">
    <div>نتيجتك</div>
    <div class="sc"><span id="sc">0</span> / 25</div>
    <div id="msg"></div>
  </div>

  <div id="quiz"></div>

  <button class="btn" id="go">صحح الامتحان</button>
  <button class="btn ghost" id="again" style="display:none">إعادة الامتحان</button>

  <div class="end">
    <p id="quote"></p>
    <p class="name">فاطمة هاني</p>
  </div>
</div>

<script>
const Q=[
{q:"عينة لبن حجمها 10 مل، وعيارية الصودا 1/9، ونزل من السحاحة 2.6 مل. نتيجة اختباري الكحول والغليان لهذه العينة:",o:["الاثنان موجبان","الكحول موجب والغليان سالب","الاثنان سالبان","الكحول سالب والغليان موجب"],a:0,e:"الحموضة = 2.6 × 0.1 = 0.26%، ودي أكبر من 0.21 وأكبر من 0.25، فالاتنين هيدوا نتيجة موجبة."},
{q:"عينة حجمها 20 مل، وعيارية الصودا 1/9، ونزل 4 مل. النسبة المئوية للحموضة:",o:["0.2%","0.4%","0.04%","0.36%"],a:0,e:"العينة مش 10 مل، فالقانون المختصر ممنوع. بالقانون الطويل: (4 × 1/9 × 90 × 100) ÷ (1000 × 20) = 4000 ÷ 20000 = 0.2%."},
{q:"عينة أعطت نتيجة موجبة مع الكحول وسالبة مع الغليان. حموضتها:",o:["بين 0.21% و 0.25%","أقل من 0.21%","أكبر من 0.25%","تساوي 0.14%"],a:0,e:"عدت حد الكحول (0.21) لكن لسه ما وصلتش لحد الغليان (0.25)، يبقى محصورة بينهم."},
{q:"أي العبارتين يصف الاختبار الأكثر حساسية في كشف بداية ارتفاع حموضة اللبن؟",o:["الكحول، لأنه يعطي نتيجة موجبة عند حموضة أقل","الغليان، لأنه يستخدم حرارة عالية","الغليان، لأن مدته أطول","الاثنان لهما نفس الحساسية"],a:0,e:"الكحول بيكشف عند 0.21، والغليان مستني لحد 0.25. يعني الكحول بيدق الجرس الأول."},
{q:"النتيجة الموجبة في اختبار التجبن بالكحول تعني أن اللبن:",o:["ضعيف الثبات الحراري وغير آمن للمعاملات الحرارية","طازج وصالح للتصنيع","خالٍ من المضادات الحيوية","مرتفع في نسبة الدهن"],a:0,e:"موجب هنا معناه حاجة وحشة: اللبن اتقطع، يعني مش هيستحمل التسخين في المصنع."},
{q:"النسبة بين كمية اللبن وكمية الكحول في اختبار التجبن بالكحول، وتركيز الإيثانول:",o:["1 : 1 وتركيز 68%","1 : 2 وتركيز 68%","1 : 1 وتركيز 90%","2 : 1 وتركيز 70%"],a:0,e:"3 مل لبن + 3 مل كحول، يعني كمية اللبن = كمية الكحول، والإيثانول 68%."},
{q:"في اختبار التجبن بالغليان، مكان ظهور القطع المتخثرة ومدة الغليان على الترتيب:",o:["الجزء العلوي، 5 دقائق","الجدار الداخلي للأنبوبة، 5 ثوانٍ","القاع، 10 دقائق","الجزء العلوي، 5 ثوانٍ"],a:0,e:"الغليان: 5 مل، 5 دقايق، وبنبص في الجزء العلوي. أما الجدار الداخلي والـ5 ثواني فدول بتوع الكحول."},
{q:"كل ما يلي يرجع إليه الحموضة الطبيعية في اللبن ما عدا:",o:["حمض اللاكتيك الناتج عن نشاط الميكروبات","أملاح الفوسفات والسترات","غاز ثاني أكسيد الكربون","بعض بروتينات الشرش"],a:0,e:"الحموضة الطبيعية من مكونات اللبن نفسه. لما الميكروبات تشتغل وتعمل حمض لاكتيك، دي بقت حموضة متطورة مش طبيعية."},
{q:"عينة لبن دهنها أعلى من عينة أخرى بمقدار 2%. المتوقع أن جوامدها اللادهنية أعلى بمقدار:",o:["0.8%","0.4%","2%","0.2%"],a:0,e:"كل 1% دهن يقابلها 0.4% جوامد لادهنية، يبقى 2 × 0.4 = 0.8%، وبالتالي حموضتها الطبيعية أعلى."},
{q:"لبن مرتفع الدهن أعطى حموضة أعلى قليلاً من المعتاد، والتفسير الأرجح:",o:["ارتفاع الجوامد اللادهنية المصاحب لارتفاع الدهن يرفع الحموضة الطبيعية","نمو ميكروبي سريع بسبب الدهن","خطأ في المعايرة","إضافة ماء للبن"],a:0,e:"الدهن العالي بيجي معاه جوامد لادهنية أعلى، والجوامد دي فيها كازين وأملاح، فالحموضة الطبيعية بتطلع أعلى من غير أي فساد."},
{q:"كل ما يلي من عناصر الصلاحية التكنولوجية للبن ما عدا:",o:["القابلية للتجنيس","القابلية للخض","القابلية للفرز","الثبات الحراري"],a:0,e:"العناصر خمسة: ثبات حراري، تخمرات ميكروبية، قدرة تجبنية وخواص خثرة، فرز، خض. التجنيس عملية تصنيع مش عنصر صلاحية."},
{q:"مصنع لاحظ تجبن اللبن المعد للبسترة قبل دخوله الجهاز. المشكلة في:",o:["الثبات الحراري نتيجة خلل الاتزان الملحي","القابلية للخض","القدرة التجبنية","القابلية للفرز"],a:0,e:"اللبن اتقطع بالحرارة، يبقى ثباته الحراري ضعيف، وأهم سبب هو اختلال التوازن بين الكالسيوم والماغنسيوم من ناحية والفوسفات والسترات من الناحية التانية."},
{q:"لبن ارتفعت فيه نسبة الكالسيوم والماغنسيوم بوضوح. المتوقع:",o:["ثبات حراري ضعيف ويحتاج تعديل نسبتهما","ثبات حراري ممتاز","زيادة القابلية للخض","بطء تطور الحموضة"],a:0,e:"زيادتهم بتخلي المرجيحة مايلة، والنتيجة لبن بيتقطع بسرعة مع التسخين."},
{q:"عبوات زبادي تطور الحموضة فيها بطيء رغم سلامة البادئ. السبب الأرجح من بين الآتي:",o:["وجود بقايا مضادات حيوية في اللبن","انخفاض نسبة الكالسيوم","صغر حجم حبيبات الدهن","ارتفاع نسبة الدهن"],a:0,e:"البادئ واقف معناه فيه حاجة بتقتل الميكروبات: مضادات حيوية، مثبطات طبيعية، بكتيروسينات، أو فيروسات بكتيرية."},
{q:"كل ما يلي يؤثر على صلاحية اللبن للتخمرات الميكروبية ما عدا:",o:["انخفاض نسبة الكالسيوم","الفيروسات البكتيرية","النيسين","الأجلوتينين"],a:0,e:"الكالسيوم ده بتاع التجبن والثبات الحراري. أعداء البادئ: مثبطات طبيعية، بكتيروسينات، فيروسات بكتيرية، وبقايا مضادات حيوية."},
{q:"النيسين واللاكتينين ينتميان على الترتيب إلى:",o:["البكتيروسينات والمثبطات الطبيعية","المثبطات الطبيعية والبكتيروسينات","البادئات والفيروسات البكتيرية","المضادات الحيوية والبكتيروسينات"],a:0,e:"النيسين بكتيروسين، واللاكتينين والأجلوتينين مثبطات طبيعية. الترتيب ده بيتلخبط كتير."},
{q:"لبن مالت نسبة الـ pH فيه إلى القلوية. المشكلة ستظهر في:",o:["القدرة التجبنية وخواص الخثرة","القابلية للفرز","القابلية للخض","تكوين طبقة القشدة"],a:0,e:"التجبن محتاج وسط حامضي شوية. القلوية بتخلي جزيئات الكازين تفضل تتنافر وما تتلمش، فالخثرة تطلع ضعيفة."},
{q:"لبن ضعيف التجبن بعد التأكد من خلو الماشية من المرض وأن اللبن ليس في آخر موسم الحليب. السبب الأرجح:",o:["انخفاض نسبة الكازين لبروتينات الشرش","ارتفاع نسبة الكالسيوم","ميل الـ pH إلى الحموضة","كبر حجم حبيبات الدهن"],a:0,e:"الأسباب التلاتة: pH مايل للقلوية، نسبة الكازين لبروتينات الشرش منخفضة، والكالسيوم منخفض."},
{q:"سبب عدم صلاحية اللبن المعقم للتجبن بالمنفحة:",o:["اتحاد البيتالاكتوجلوبيولين مع الكابا كازين","تحلل اللاكتوز بالكامل","زيادة حجم حبيبات الدهن","ارتفاع نسبة الكالسيوم الذائب"],a:0,e:"الحرارة العالية بتلزق بروتين الشرش في الكابا كازين، فالمنفحة ما بقاش لها مكان تشتغل عليه، زي قفل اتسد."},
{q:"من تأثيرات المعاملة الحرارية على القدرة التجبنية:",o:["تقليل حجم جزيئات كازينات الكالسيوم مع ترسيب بروتينات الشرش وطول مدة التجبن","زيادة حجم جزيئات الكازين وسرعة التجبن","زيادة الكالسيوم الغروي","تحسين قوام الخثرة"],a:0,e:"الحرارة بتصغّر كازينات الكالسيوم وترسّب بروتين الشرش، فالتجبن بياخد وقت أطول والخثرة بتبقى أقل جودة."},
{q:"مصنع زبد يشكو من بطء عملية الخض. كل ما يلي قد يكون سبباً ما عدا:",o:["كبر حجم حبيبات الدهن","ارتفاع حموضة اللبن","اللبن من ماشية في نهاية مرحلة الإدرار","صغر حجم حبيبات الدهن"],a:0,e:"الحبيبات الكبيرة بتتجمع بسرعة فبتسرّع الخض. اللي بيبطّأه هو أي عامل بيثبّت المستحلب."},
{q:"حبيبات الدهن التي يقل قطرها عن 2 ميكرون:",o:["تبقى في اللبن الفرز لصعوبة فصلها","تنفصل أولاً مع القشدة","تتجمع بسرعة أثناء الخض","ترفع الثبات الحراري"],a:0,e:"صغيرة أوي على الفراز، فبتفضل مع اللبن الفرز وما بتطلعش مع القشدة."},
{q:"مصنع يريد إنتاج جبن جاف عالي الجودة ومنتجات دهنية فاخرة. التوزيع الأنسب:",o:["البقري للجبن الجاف والجاموسي للمنتجات الدهنية","الجاموسي للجبن الجاف والبقري للمنتجات الدهنية","الجاموسي للاثنين","البقري للاثنين"],a:0,e:"البقري فيه نسبة الكازين للدهن 0.7 وهي الأفضل للجبن الجاف، والجاموسي حبيبات دهنه كبيرة فهو بطل المنتجات الدهنية."},
{q:"سبب محدودية استخدام اللبن الجاموسي في صناعة الجبن الجافة:",o:["كبر حجم جسيمات الكازين وارتفاع محتوى الكازين من الكالسيوم","انخفاض نسبة الدهن","صغر حجم حبيبات الدهن","رائحته المميزة"],a:0,e:"الجاموسي كله كبير: كازين كبير وكالسيوم عالي، فالجبن بيفقد القوام والتركيب المرغوب ومعدلات التسوية بتقل."},
{q:"لبن يحتوي على مثبطات طبيعية تعوق بكتيريا حمض اللاكتيك، وبروتينات شرش مرتفعة تثبط المنفحة، وحبيبات دهن صغيرة. هذا الوصف ينطبق على:",o:["لبن الإبل","لبن الماعز","اللبن الجاموسي","لبن الأغنام"],a:0,e:"ده لبن الإبل، وهو بايظ في كل العناصر تقريباً: تخمر، تجبن، فرز، ثبات حراري، وزبد."}
];
const quiz=document.getElementById('quiz');
Q.forEach((q,i)=>{
  const d=document.createElement('div');d.className='q';d.id='q'+i;
  d.innerHTML='<div class="qh"><span class="n">'+(i+1)+'.</span>'+q.q+'</div>'+
    q.o.map((o,k)=>'<label data-k="'+k+'"><input type="radio" name="q'+i+'" value="'+k+'">'+o+'</label>').join('')+
    '<div class="fb" id="f'+i+'"></div>';
  quiz.appendChild(d);
});
document.getElementById('go').onclick=function(){
  let s=0,first=null;
  Q.forEach((q,i)=>{
    const box=document.getElementById('q'+i);
    const picked=box.querySelector('input:checked');
    const fb=document.getElementById('f'+i);
    box.querySelectorAll('input').forEach(x=>x.disabled=true);
    box.querySelectorAll('label').forEach(l=>{
      const k=+l.dataset.k;
      if(picked&&+picked.value===k)l.classList.add('sel');
      if(k===q.a)l.classList.add('key');
    });
    const ok=picked&&+picked.value===q.a;
    if(ok)s++;else if(first===null)first=box;
    box.classList.add(ok?'right':'wrong');
    fb.className='fb show '+(ok?'ok':'no');
    fb.innerHTML='<b>'+(ok?'إجابة صحيحة':(picked?'إجابة خاطئة':'لم تتم الإجابة'))+'</b>'+q.e;
  });
  document.getElementById('sc').textContent=s;
  const p=s/25*100;
  document.getElementById('msg').textContent = p>=90?'مستوى ممتاز، استمر على كده.':p>=70?'مستوى كويس، راجع الأسئلة اللي غلط وهتوصل للفل مارك.':p>=50?'نص الطريق خلص، ركز على الأرقام والتريكات وأعد الامتحان.':'محتاج مراجعة تانية للمحاضرة، وبعدين أعد الامتحان وهتلاقي فرق كبير.';
  document.getElementById('result').classList.add('show');
  document.getElementById('again').style.display='block';
  document.getElementById('result').scrollIntoView({behavior:'smooth'});
};
document.getElementById('again').onclick=function(){location.reload()};
document.getElementById('quote').textContent='المذاكرة مش شطارة، دي عادة. كل يوم خطوة صغيرة بتفرق في الآخر… بالتوفيق للجميع.';
</script>
</body>
</html>
